<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Craftmancer Studios — Artist Admin</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <main class="admin-page">

        <section class="admin-login" aria-labelledby="admin-title">

            <p class="admin-eyebrow">
                Craftmancer Studios
            </p>

            <h1 id="admin-title">
                Artist Admin
            </h1>

            <p class="admin-intro">
                Private studio access.
            </p>

            <form id="admin-login-form">

                <div class="admin-field">

                    <label for="admin-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="admin-field">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="admin-submit"
                >
                    Enter Studio
                </button>

                <p
                    id="admin-login-message"
                    class="admin-message"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-test.js"></script>

</body>
</html>
