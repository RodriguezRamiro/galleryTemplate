<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Craftmancer Studios — Artist Dashboard</title>

    <link rel="stylesheet"
        href="./admin-style.css">

</head>


<body>

    <main class="admin-dashboard">

        <!-- =================================================
             Dashboard Header
        ================================================== -->

        <header class="admin-dashboard-header">

            <div>

                <p class="admin-eyebrow">
                    Craftmancer Studios
                </p>

                <h1>
                    Artist Dashboard
                </h1>

                <p class="admin-intro">
                    Studio administration.
                </p>

            </div>


            <button
                type="button"
                id="admin-sign-out"
                class="admin-submit">

                Sign Out

            </button>

        </header>


        <!-- =================================================
             Overview
        ================================================== -->

        <section
            class="admin-overview"
            aria-labelledby="overview-title">

            <h2 id="overview-title">
                Overview
            </h2>


            <div class="admin-overview-grid">

                <article class="admin-stat">

                    <span
                        id="artwork-count"
                        class="admin-stat-number">

                        —

                    </span>

                    <span class="admin-stat-label">
                        Artworks
                    </span>

                </article>


                <article class="admin-stat">

                    <span
                        id="exhibition-count"
                        class="admin-stat-number">

                        —

                    </span>

                    <span class="admin-stat-label">
                        Exhibitions
                    </span>

                </article>


                <article class="admin-stat">

                    <span
                        id="featured-count"
                        class="admin-stat-number">

                        —

                    </span>

                    <span class="admin-stat-label">
                        Featured
                    </span>

                </article>

            </div>

        </section>


        <!-- =================================================
             Artwork Collection
        ================================================== -->

        <section
            class="admin-section"
            aria-labelledby="artworks-title">

            <div class="admin-section-header">

                <div>

                    <p class="admin-eyebrow">
                        Collection
                    </p>

                    <h2 id="artworks-title">
                        Artworks
                    </h2>

                </div>


                <button
                    type="button"
                    id="add-artwork-button"
                    class="admin-submit">

                    + Add Artwork

                </button>

            </div>


            <div
                id="admin-artwork-list"
                class="admin-artwork-list">

                <p class="admin-message">
                    Loading artworks...
                </p>

            </div>

        </section>

        <!-- Add Artwork Panel -->
<section
id="add-artwork-panel"
class="admin-section admin-form-section"
aria-labelledby="add-artwork-title"
hidden>

<div class="admin-section-header">
    <div>
        <p class="admin-eyebrow">
            Collection
        </p>

        <h2 id="add-artwork-title">
            Add Artwork
        </h2>
    </div>

    <button
        type="button"
        id="cancel-artwork-button"
        class="admin-submit">
        Cancel
    </button>
</div>

<form id="add-artwork-form">

    <div class="admin-form-grid">

        <div class="admin-field admin-field-full">
            <label for="artwork-image">
                Artwork Image
            </label>

            <input
                type="file"
                id="artwork-image"
                accept="image/jpeg,image/png,image/webp">
        </div>

        <div class="admin-field">
            <label for="artwork-catalog">
                Catalog Number
            </label>

            <input
                type="text"
                id="artwork-catalog"
                required>
        </div>

        <div class="admin-field">
            <label for="artwork-title">
                Title
            </label>

            <input
                type="text"
                id="artwork-title"
                required>
        </div>

        <div class="admin-field">
            <label for="artwork-medium">
                Medium
            </label>

            <input
                type="text"
                id="artwork-medium">
        </div>

        <div class="admin-field">
            <label for="artwork-year">
                Year
            </label>

            <input
                type="number"
                id="artwork-year">
        </div>

        <div class="admin-field">
            <label for="artwork-dimensions">
                Dimensions
            </label>

            <input
                type="text"
                id="artwork-dimensions"
                placeholder="16 × 20">
        </div>

        <div class="admin-field">
            <label for="artwork-purchase-url">
                Purchase URL
            </label>

            <input
                type="url"
                id="artwork-purchase-url"
                placeholder="https://">
        </div>

        <div class="admin-field admin-field-full">
            <label for="artwork-description">
                Description
            </label>

            <textarea
                id="artwork-description"
                rows="6">
            </textarea>
        </div>

    </div>

    <div class="admin-form-actions">

        <button
            type="submit"
            class="admin-submit">
            Save Artwork
        </button>

    </div>

    <p
        id="add-artwork-message"
        class="admin-message"
        aria-live="polite">
    </p>

</form>

</section>


        <!-- =================================================
             Exhibitions
        ================================================== -->

        <section
            class="admin-section"
            aria-labelledby="exhibitions-title">

            <div class="admin-section-header">

                <div>

                    <p class="admin-eyebrow">
                        Exhibitions
                    </p>

                    <h2 id="exhibitions-title">
                        Exhibitions
                    </h2>

                </div>


                <button
                    type="button"
                    class="admin-submit">

                    + New Exhibition

                </button>

            </div>


            <div
                id="admin-exhibition-list"
                class="admin-exhibition-list">

                <p class="admin-message">
                    Loading exhibitions...
                </p>

            </div>

        </section>


        <!-- =================================================
             Dashboard Status
        ================================================== -->

        <p
            id="dashboard-message"
            class="admin-message"
            aria-live="polite">
        </p>

    </main>


    <!-- =====================================================
         Supabase
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./supabase-test.js"></script>

    <script src="./admin-dashboard.js"></script>

</body>

</html>
