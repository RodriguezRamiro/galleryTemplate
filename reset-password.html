<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Craftmancer Studios — Reset Password</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <main class="admin-page">

        <section class="admin-login" aria-labelledby="reset-title">

            <p class="admin-eyebrow">
                Craftmancer Studios
            </p>

            <h1 id="reset-title">
                Set New Password
            </h1>

            <p class="admin-intro">
                Choose a new password for your studio account.
            </p>

            <form id="reset-password-form">

                <div class="admin-field">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        autocomplete="new-password"
                        required
                        minlength="8"
                    >

                </div>

                <div class="admin-field">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        autocomplete="new-password"
                        required
                        minlength="8"
                    >

                </div>

                <button
                    type="submit"
                    class="admin-submit"
                >
                    Set New Password
                </button>

                <p
                    id="reset-message"
                    class="admin-message"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-test.js"></script>
    <script src="./reset-password.js"></script>

</body>
</html>
